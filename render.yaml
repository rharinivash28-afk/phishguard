# Render Blueprint — one Web Service running both the API and the built UI.
# Deploy: push this repo to GitHub, then in Render: New + -> Blueprint -> pick the repo.
services:
  - type: web
    name: phishguard
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: RENDER
        value: "true"

      # --- REQUIRED: external Postgres for per-user data ---------------------
      # Free permanent options: Neon (neon.tech) or Supabase. Create a project,
      # copy the connection string, paste it here (Render will prompt because of
      # sync:false). Without it the app falls back to an ephemeral SQLite file
      # that is wiped on every redeploy.
      - key: DATABASE_URL
        sync: false

      # --- REQUIRED: encryption key for stored Gmail app passwords ----------
      # Render generates a strong random value. If it ever changes, users just
      # re-enter their app password.
      - key: APP_SECRET_KEY
        generateValue: true

      # --- optional tuning -------------------------------------------------
      # - key: SESSION_TTL_DAYS      # idle days before a workspace is swept
      #   value: "14"
      # - key: POLL_INTERVAL_SECONDS # background Gmail poll cadence
      #   value: "60"
