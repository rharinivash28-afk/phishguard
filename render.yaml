# Render Blueprint — one Web Service running both the API and the built UI.
# Deploy: push this repo to GitHub, then in Render: New + -> Blueprint -> pick the repo.
services:
  - type: web
    name: phishguard
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: RENDER
        value: "true"
      # Render sets RENDER_EXTERNAL_URL automatically; the app derives the OAuth
      # redirect URI from it. Override here only if you use a custom domain.
      # - key: GOOGLE_REDIRECT_URI
      #   value: https://your-domain.com/api/auth/google/callback
      #
      # Optional: pre-seed Google OAuth so users skip the in-app setup step.
      # - key: GOOGLE_CLIENT_ID
      #   sync: false
      # - key: GOOGLE_CLIENT_SECRET
      #   sync: false
